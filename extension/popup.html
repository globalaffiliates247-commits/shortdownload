<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAIO Cookie Exporter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --accent: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 330px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .badge-v {
      font-size: 10px;
      font-weight: 600;
      background: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.4);
      padding: 2px 6px;
      border-radius: 9999px;
    }
    .domain-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .domain-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .domain-label {
      color: var(--text-muted);
      font-size: 11px;
    }
    .domain-val {
      font-weight: 600;
      color: #38bdf8;
      font-size: 12px;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .options-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .checkbox-label input {
      accent-color: var(--primary);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 7px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--card);
      color: #cbd5e1;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #334155;
      color: white;
    }
    .status-toast {
      display: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      margin-top: 8px;
      animation: fadeIn 0.2s ease;
    }
    .status-toast.success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
      display: block;
    }
    .status-toast.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      display: block;
    }
    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(51, 65, 85, 0.5);
      font-size: 10.5px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .security-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #94a3b8;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-wrap">
      <div class="logo-icon">🍪</div>
      <div class="title">TAIO Cookie Exporter</div>
    </div>
    <span class="badge-v">v1.0</span>
  </div>

  <div class="domain-box">
    <div class="domain-row">
      <span class="domain-label">Trang web hiện tại:</span>
      <span id="domainVal" class="domain-val">Đang quét...</span>
    </div>
    <div class="domain-row" style="margin-bottom: 0;">
      <span class="domain-label">Trạng thái cookies:</span>
      <span id="cookieCount" class="count-badge">0 cookies</span>
    </div>
  </div>

  <div class="options-group">
    <label class="checkbox-label">
      <input type="checkbox" id="currentDomainOnly" checked>
      <span>Chỉ xuất cookies trang này (khuyên dùng)</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="netscapeFormat" checked disabled>
      <span>Định dạng Netscape (Chuẩn yt-dlp / curl)</span>
    </label>
  </div>

  <button id="btnDownload" class="btn btn-primary">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    <span>Tải file cookies.txt</span>
  </button>

  <button id="btnCopy" class="btn btn-secondary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    <span>Sao chép vào Clipboard</span>
  </button>

  <div id="statusToast" class="status-toast"></div>

  <div class="footer">
    <span class="security-badge">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      100% Offline & Riêng tư
    </span>
    <span>TAIO Studio</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
